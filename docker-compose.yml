version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: helpdesk-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: helpdesk
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d helpdesk"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: helpdesk-web
    restart: always
    ports:
      - '5000:5000'
      - '2525:2525'
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/helpdesk?schema=public
      - NODE_ENV=production
      - PORT=5000
      - CLIENT_URL=http://localhost:5000
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - BETTER_AUTH_URL=http://localhost:5000
      - TRUSTED_ORIGINS=http://localhost:5000
      - SESSION_SECRET=${SESSION_SECRET}
      - ADMIN_EMAIL=admin@example.com
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - SENDGRID_API_KEY=${SENDGRID_API_KEY}
      - EMAIL_FROM=${EMAIL_FROM}

    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
